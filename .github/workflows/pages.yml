name: Deploy EQ Fit to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "15 17 * * *" # Daily 04:15 Sydney during daylight saving, 03:15 otherwise.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test            # real-data tests skip themselves: data-local/ is never in the repo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare current-news banter (optional)
        run: python scripts/generate_coach_news.py
        timeout-minutes: 5
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COACH_NEWS_MODEL: ${{ vars.CLAUDE_NEWS_MODEL || 'claude-sonnet-5-5' }}
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://hihqnnxnlkjfbixhcgaa.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Sua-_BE2Bnjq9c_V9siXUQ_BBe5j99J
          VITE_EQFIT_OWNER_ID: 51f91a0d-c975-4702-b4e8-5a9afce5d1f5
      # base is './', so the app works from /<repo-name>/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
