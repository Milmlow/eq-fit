name: Garmin export checks

on:
  pull_request:
    paths:
      - 'scripts/export_garmin_encrypted.py'
      - 'scripts/decrypt_garmin_export.py'
      - 'tests/test_garmin_export.py'
      - 'src/lib/garminEncrypted.ts'
      - 'src/ui/ImportScreen.tsx'
      - '.github/workflows/garmin-export-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python -m pip install --disable-pip-version-check 'cryptography>=44,<47'
      - run: python -m unittest discover -s tests -p test_garmin_export.py -v
      - run: npm ci
      - run: npm test
      - run: npm run build
