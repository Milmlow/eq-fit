name: Garmin connection check (no fitness data saved)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Validate Garmin activity access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install official Garmin client
        run: python -m pip install --disable-pip-version-check 'garmin-connect-personal-api-python==1.0.0'

      - name: Test Garmin connection without exposing data
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
        run: python scripts/check_garmin_connection.py
